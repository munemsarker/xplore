<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XPLORE — Planet Jumping & Solar System Explorer</title>
    <meta name="description" content="An immersive space portal and solar system exploration experience with 3D canvas portals, cinematic planetary transitions, and comprehensive planetary and lunar dossiers." />
    <meta property="og:title" content="XPLORE — Planet Jumping & Solar System Explorer" />
    <meta property="og:description" content="An immersive space portal and solar system exploration experience with 3D canvas portals, cinematic planetary transitions, and comprehensive planetary and lunar dossiers." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <style>
      /* 2. FONTS */
      @font-face {
        font-family: 'SF Pro';
        src: local('SF Pro Text'), local('SF Pro'), local('SFProText-Regular'), local('Helvetica Neue'), local('Arial');
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: 'SF Pro';
        src: local('SF Pro Text Bold'), local('SF Pro Bold'), local('SFProText-Bold'), local('Helvetica Neue Bold'), local('Arial Bold');
        font-weight: 700;
        font-style: normal;
      }
      @font-face {
        font-family: 'SF Pro Thin';
        src: local('SF Pro Display Thin'), local('SF Pro Thin'), local('SFProDisplay-Thin');
        font-weight: 100;
        font-style: normal;
      }
      @font-face {
        font-family: 'Aalto';
        src: local('Aalto'), local('Aalto-Regular'), local('Arial Narrow'), local('Impact');
        font-weight: 400;
        font-style: normal;
      }
      :root {
        font-family: 'SF Pro', Arial, sans-serif;
        color: #fff;
        background: #090807;
        font-synthesis: none;
      }

      /* 5. LAYOUT CSS (exact values) */
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .experience {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 540px;
        overflow: hidden;
        background: #0a0908;
      }
      .backgrounds, .background, .shade, .transition-layer, .transition-layer video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .background {
        object-fit: cover;
        opacity: 0;
        transition: opacity .8s ease;
      }
      .background.is-visible {
        opacity: 1;
      }
      .shade {
        z-index: 1;
        background: linear-gradient(to bottom, transparent 52%, rgba(0, 0, 0, .88) 100%);
        pointer-events: none;
      }
      .chrome {
        position: absolute;
        z-index: 4;
        transition: opacity .45s ease, filter .45s ease;
      }
      .experience.is-transitioning .chrome {
        opacity: 0;
        filter: blur(8px);
        pointer-events: none;
      }

      /* HEADER */
      .header {
        left: clamp(18px, 1.95vw, 28px);
        right: clamp(18px, 1.95vw, 28px);
        top: clamp(18px, 3.1vh, 28px);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .header-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-left: 48px; /* space for docked floating logo */
        user-select: none;
      }
      .brand-badge-xp {
        font-weight: 900;
        font-size: 14px;
        letter-spacing: -0.04em;
        background: #fff;
        color: #000;
        padding: 3px 7px;
        border-radius: 5px;
        line-height: 1.1;
      }
      .brand-name-xplore {
        font-weight: 800;
        font-size: 16px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #fff;
      }
      .header-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .nav {
        display: flex;
        align-items: center;
        height: 42px;
        padding: 4px 5px;
        border: 1px solid rgba(255, 255, 255, .45);
        background: rgba(255, 255, 255, .1);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 999px;
      }
      .nav a {
        color: #fff;
        text-decoration: none;
        padding: 8px 19px;
        border-radius: 999px;
        line-height: 1;
        font-size: 14px;
        transition: background .2s, color .2s;
      }
      .nav a.active {
        background: #fff;
        color: #000;
      }
      .menu {
        height: 42px;
        padding: 0 20px;
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #000;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: transform .2s ease, background .2s ease;
      }
      .menu:hover {
        background: rgba(255, 255, 255, 0.9);
        transform: scale(1.02);
      }
      .menu:active {
        transform: scale(0.98);
      }

      /* SIDEBAR */
      .planet-list {
        left: clamp(18px, 1.95vw, 28px);
        top: 50%;
        transform: translateY(-43%);
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 15px;
        user-select: none;
        max-height: 70vh;
        overflow-y: auto;
        padding-right: 8px;
        scrollbar-width: none;
      }
      .planet-list::-webkit-scrollbar {
        display: none;
      }
      .planet-tabs {
        display: flex;
        gap: 4px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.22);
        padding: 3px;
        border-radius: 999px;
        margin-bottom: 8px;
        width: fit-content;
      }
      .planet-tab-btn {
        background: transparent;
        border: 0;
        color: rgba(255, 255, 255, 0.75);
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all .2s ease;
      }
      .planet-tab-btn.active {
        background: #fff;
        color: #000;
      }
      .planet-item {
        display: flex;
        align-items: center;
        min-height: 22px;
        color: rgba(255, 255, 255, 0.65);
        cursor: pointer;
        transition: color .2s ease, transform .2s ease;
      }
      .planet-item:hover {
        color: #fff;
        transform: translateX(4px);
      }
      .planet-item.active {
        font-size: 17px;
        font-weight: 700;
        gap: 8px;
        color: #fff;
      }
      .planet-item.active:before {
        content: '';
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #fff;
        display: inline-block;
      }

      /* PORTAL */
      .portal-wrap {
        left: 50%;
        top: 50%;
        width: min(320px, 31vw);
        transform: translate(-50%, -54%);
        perspective: none;
      }
      .portal-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        font-size: 16px;
        opacity: 0;
      }
      .portal-heading strong {
        font-size: 18px;
        margin-left: 8px;
      }
      .portal {
        position: relative;
        display: block;
        width: 100%;
        aspect-ratio: 320/350;
        padding: 0;
        overflow: visible;
        border: 0;
        border-radius: 90px;
        background: transparent;
        cursor: pointer;
        box-shadow: none;
        transform: none !important;
      }
      .portal:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.8);
        outline-offset: 4px;
      }
      .portal video, .portal img {
        visibility: hidden;
        position: absolute;
        width: 1px;
        height: 1px;
        pointer-events: none;
      }
      .portal-canvas {
        position: fixed;
        inset: 0;
        z-index: 3;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      /* CONTENT */
      .planet-content {
        left: clamp(28px, 4vw, 58px);
        right: clamp(28px, 3vw, 44px);
        bottom: clamp(34px, 4vh, 46px);
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 40px;
        pointer-events: none;
      }
      .planet-content h1 {
        font-family: Aalto, 'Arial Narrow', sans-serif;
        font-size: clamp(128px, 21.8vw, 314px);
        font-weight: 400;
        line-height: .72;
        margin: 0 0 -.04em;
        letter-spacing: 0;
        transform: translateX(-32px);
        opacity: 0;
        text-transform: uppercase;
      }
      .planet-content dl {
        width: min(447px, 34vw);
        margin: 0;
        font-size: 16px;
      }
      .fact {
        display: grid;
        grid-template-columns: 138px 1fr;
        gap: 18px;
        padding: 8px 0;
        border-bottom: 1px solid rgba(255, 255, 255, .48);
        opacity: 0;
      }
      .fact:last-child {
        border-bottom: 0;
      }
      .fact dt {
        font-weight: 700;
        color: #fff;
      }
      .fact dd {
        margin: 0;
        color: rgba(255, 255, 255, 0.9);
      }

      /* FOOTER */
      .experience-footer {
        position: absolute;
        left: clamp(18px, 1.95vw, 28px);
        right: clamp(18px, 1.95vw, 28px);
        bottom: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.65);
        z-index: 6;
        pointer-events: auto;
      }
      .footer-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .footer-tag {
        font-weight: 700;
        color: rgba(255, 255, 255, 0.9);
      }
      .footer-sep {
        opacity: 0.4;
      }
      .footer-status {
        font-family: monospace;
        color: rgba(255, 255, 255, 0.7);
      }
      .footer-right {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .footer-right strong {
        color: #fff;
        font-weight: 700;
      }

      /* MISC */
      .transition-layer {
        display: none;
      }
      .scene-canvas {
        display: none;
      }
      .loading {
        position: absolute;
        z-index: 12;
        left: 50%;
        bottom: 30px;
        transform: translateX(-50%);
        opacity: 0;
        font-size: 12px;
        letter-spacing: .14em;
        text-transform: uppercase;
        transition: opacity .2s;
        pointer-events: none;
      }
      .experience.is-loading .loading {
        opacity: .8;
      }
      .experience.is-transitioning .header,
      .experience.is-transitioning .planet-list {
        opacity: 1;
        filter: none;
        pointer-events: auto;
      }
      .experience.is-transitioning .shade {
        opacity: 1;
      }
      .experience.is-committing .background {
        transition: none !important;
      }

      /* 6. PRELOADER */
      .preloader {
        position: absolute;
        inset: 0;
        z-index: 20;
        background: #000;
        overflow: hidden;
      }
      .preloader video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .preloader-shade {
        position: absolute;
        inset: auto 0 0;
        height: 35%;
        background: linear-gradient(to bottom, transparent, #000);
      }
      .preloader.is-background {
        z-index: 0;
      }
      .preloader.is-background .preloader-shade {
        opacity: 0;
      }
      .floating-logo {
        position: fixed;
        z-index: 22;
        left: 50%;
        top: 50%;
        width: 59px;
        height: 58px;
        transform: translate(-50%, -50%);
        will-change: left, top, width, height, transform;
        transition: left 2s cubic-bezier(.16, 1, .3, 1),
                    top 2s cubic-bezier(.16, 1, .3, 1),
                    width 2s cubic-bezier(.16, 1, .3, 1),
                    height 2s cubic-bezier(.16, 1, .3, 1),
                    transform 2s cubic-bezier(.16, 1, .3, 1);
        pointer-events: none;
      }
      .floating-logo.is-docked {
        left: clamp(18px, 1.95vw, 28px);
        top: clamp(18px, 3.1vh, 28px);
        width: 37px;
        height: 36px;
        transform: none;
      }
      .floating-logo.is-settled {
        z-index: 5;
      }
      .preloader-count {
        position: fixed;
        z-index: 22;
        left: 50%;
        bottom: clamp(22px, 3.1vh, 28px);
        display: flex;
        align-items: flex-end;
        gap: 4px;
        transform: translateX(-50%);
        font-family: 'SF Pro', Arial, sans-serif;
        line-height: 1;
        pointer-events: none;
      }
      .preloader-count > span:first-child {
        font-family: 'SF Pro Thin', 'SF Pro', Arial, sans-serif;
        font-size: 64px;
        font-weight: 100;
      }
      .preloader-count .percent {
        font-size: 24px;
        padding-bottom: 4px;
      }
      .preloader-count.is-leaving {
        animation: preload-count-out .75s cubic-bezier(.22, 1, .36, 1) both;
      }
      @keyframes preload-count-out {
        to {
          opacity: 0;
          filter: blur(7px);
          transform: translate(-50%, -34px);
        }
      }
      body:not(.preload-complete) .custom-cursor {
        opacity: 0 !important;
      }

      /* 9. CUSTOM CURSOR */
      html, body, button, a, .portal {
        cursor: none !important;
      }
      .custom-cursor {
        display: block;
        position: fixed;
        left: 0;
        top: 0;
        z-index: 100;
        width: 1px;
        height: 1px;
        pointer-events: none;
        opacity: 0;
        transition: opacity .2s ease;
      }
      .custom-cursor.is-visible {
        opacity: 1;
      }
      .cursor-dot, .cursor-orbit {
        position: absolute;
        left: 0;
        top: 0;
        border-radius: 50%;
        transform: translate(-50%, -50%);
      }
      .cursor-dot {
        width: 12px;
        height: 12px;
        background: #fff;
      }
      .cursor-orbit {
        width: 36px;
        height: 36px;
        border: 1px solid #fff;
        background: rgba(255, 255, 255, .4);
        transition: transform .3s cubic-bezier(.22, 1, .36, 1);
      }
      .custom-cursor.is-enter .cursor-orbit {
        transform: translate(-50%, -50%) scale(1.16);
      }
      .cursor-label {
        position: absolute;
        top: 26px;
        left: 0;
        transform: translateX(-50%) translateY(-4px);
        font: 16px/1.2 'SF Pro', Arial, sans-serif;
        white-space: nowrap;
        opacity: 0;
        transition: opacity .2s ease, transform .3s cubic-bezier(.22, 1, .36, 1);
      }
      .custom-cursor.is-enter .cursor-label {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* 10. ENTRANCE / SWITCH ANIMATIONS */
      body:not(.intro-ready) .header,
      body:not(.intro-ready) .planet-list,
      body:not(.intro-ready) .planet-content h1,
      body:not(.intro-ready) .planet-content .fact,
      body:not(.intro-ready) .experience-footer {
        opacity: 0;
      }
      .intro-ready .header {
        animation: reveal-down .9s cubic-bezier(.22, 1, .36, 1) .1s both;
      }
      .intro-ready .planet-list {
        animation: reveal-side .9s cubic-bezier(.22, 1, .36, 1) .65s both;
      }
      .intro-ready .experience-footer {
        animation: reveal-footer .9s cubic-bezier(.22, 1, .36, 1) .75s both;
      }
      .content-revealing h1 {
        animation: title-rise 1.05s cubic-bezier(.16, 1, .3, 1) both;
      }
      .content-revealing .fact {
        animation: fact-rise .72s cubic-bezier(.22, 1, .36, 1) both;
      }
      .content-revealing .fact:nth-child(1) { animation-delay: .52s; }
      .content-revealing .fact:nth-child(2) { animation-delay: .68s; }
      .content-revealing .fact:nth-child(3) { animation-delay: .84s; }
      .content-revealing .fact:nth-child(4) { animation-delay: 1s; }

      .mask-revealing .portal-heading {
        animation: portal-caption .85s cubic-bezier(.22, 1, .36, 1) both;
      }

      .planet-list.is-switching .planet-item {
        animation: menu-row .58s cubic-bezier(.22, 1, .36, 1) both;
      }
      .planet-list.is-switching .planet-item:nth-child(1) { animation-delay: .02s; }
      .planet-list.is-switching .planet-item:nth-child(2) { animation-delay: .05s; }
      .planet-list.is-switching .planet-item:nth-child(3) { animation-delay: .08s; }
      .planet-list.is-switching .planet-item:nth-child(4) { animation-delay: .11s; }
      .planet-list.is-switching .planet-item:nth-child(5) { animation-delay: .14s; }
      .planet-list.is-switching .planet-item:nth-child(6) { animation-delay: .17s; }
      .planet-list.is-switching .planet-item:nth-child(7) { animation-delay: .2s; }
      .planet-list.is-switching .planet-item:nth-child(8) { animation-delay: .23s; }

      .planet-list.is-switching .planet-item.active:before {
        animation: active-dot .55s cubic-bezier(.22, 1, .36, 1) .18s both;
      }

      @keyframes reveal-down {
        from { opacity: 0; filter: blur(8px); transform: translateY(-18px); }
        to   { opacity: 1; filter: blur(0); transform: translateY(0); }
      }
      @keyframes reveal-side {
        from { opacity: 0; filter: blur(8px); transform: translate(-20px, -43%); }
        to   { opacity: 1; filter: blur(0); transform: translate(0, -43%); }
      }
      @keyframes reveal-footer {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes title-rise {
        from { opacity: 0; filter: blur(12px); transform: translate(-32px, 42px); }
        to   { opacity: 1; filter: blur(0); transform: translate(-32px, 0); }
      }
      @keyframes fact-rise {
        from { opacity: 0; filter: blur(7px); transform: translateY(18px); }
        to   { opacity: 1; filter: blur(0); transform: translateY(0); }
      }
      @keyframes portal-caption {
        from { opacity: 0; filter: blur(7px); transform: translateY(22px); }
        to   { opacity: 1; filter: blur(0); transform: translateY(0); }
      }
      @keyframes menu-row {
        from { opacity: .35; transform: translateX(-8px); }
        to   { opacity: 1; transform: translateX(0); }
      }
      @keyframes active-dot {
        from { opacity: 0; transform: scale(0); }
        to   { opacity: 1; transform: scale(1); }
      }

      /* 11. RESPONSIVE */
      @media(max-width: 900px) {
        .nav { display: none; }
        .portal-wrap { width: min(300px, 48vw); }
        .planet-content h1 { font-size: clamp(105px, 24vw, 190px); }
        .planet-content dl { width: 43vw; }
        .fact { grid-template-columns: 110px 1fr; }
        .planet-list { font-size: 14px; }
        .planet-item.active { font-size: 16px; }
      }
      @media(max-width: 640px) {
        .experience { min-height: 600px; }
        .planet-list { display: none; }
        .portal-wrap { top: 44%; width: min(260px, 66vw); }
        .planet-content { left: 18px; right: 18px; bottom: 38px; display: block; }
        .planet-content h1 { font-size: clamp(98px, 30vw, 160px); margin-bottom: 20px; }
        .planet-content dl { width: 100%; font-size: 13px; }
        .fact { grid-template-columns: 92px 1fr; padding: 5px 0; }
        .portal-heading { font-size: 14px; }
        .portal-heading strong { font-size: 16px; }
        .menu { height: 38px; }
        .portal { border-radius: 70px; }
        .experience-footer { flex-direction: column; align-items: flex-start; gap: 4px; bottom: 6px; font-size: 9.5px; }
      }
      @media(prefers-reduced-motion: reduce) {
        * { transition-duration: .01ms !important; }
        .portal { transform: none !important; }
      }

      /* SOLAR SYSTEM MODAL (EXPLORE ALL CELESTIAL BODIES & MOONS) */
      .solar-modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(4, 5, 8, 0.88);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        display: none;
        opacity: 0;
        transition: opacity .35s ease;
        padding: clamp(16px, 3vw, 36px);
        overflow-y: auto;
      }
      .solar-modal-backdrop.is-open {
        display: flex;
        opacity: 1;
      }
      .solar-modal-window {
        width: 100%;
        max-width: 1180px;
        margin: auto;
        background: #0d0f14;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 20px;
        padding: clamp(20px, 3vw, 36px);
        position: relative;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
      }
      .solar-modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        padding-bottom: 20px;
        margin-bottom: 24px;
      }
      .solar-modal-title {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .solar-modal-title h2 {
        margin: 0;
        font-size: clamp(20px, 2.5vw, 28px);
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .solar-modal-close {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        font-size: 20px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background .2s;
      }
      .solar-modal-close:hover {
        background: rgba(255, 255, 255, 0.25);
      }
      .solar-filter-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 24px;
      }
      .filter-btn {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: rgba(255, 255, 255, 0.8);
        padding: 8px 16px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: all .2s ease;
      }
      .filter-btn.active, .filter-btn:hover {
        background: #fff;
        color: #000;
        border-color: #fff;
      }
      .solar-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
        gap: 18px;
        max-height: 60vh;
        overflow-y: auto;
        padding-right: 6px;
      }

        { name: 'Enceladus', category: 'moons', tag: 'Saturnian Moon', desc: 'Vents cryovolcanic geysers of salty water, silica nanoparticles, and organics into space from south polar fractures.', dist: '238,000 km from Sat', year: '32.9 hours', moons: 'Orbiting Saturn', temp: '-198 °C', target: null },
        { name: 'Mimas', category: 'moons', tag: 'Saturnian Moon', desc: 'Resembles the Death Star due to the massive 130 km Herschel impact crater, with evidence of an internal stealth ocean.', dist: '185,520 km from Sat', year: '22.6 hours', moons: 'Orbiting Saturn', temp: '-209 °C', target: null },
        { name: 'Triton', category: 'moons', tag: 'Neptunian Moon', desc: 'A captured Kuiper Belt dwarf moon orbiting backwards (retrograde) with nitrogen geysers rising 8 km high.', dist: '354,760 km from Nep', year: '5.8 days', moons: 'Orbiting Neptune', temp: '-235 °C', target: null },
        { name: 'Charon', category: 'moons', tag: 'Plutonian Moon', desc: 'A tidally locked binary companion to dwarf planet Pluto with a red tholin-capped north pole (Mordor Macula).', dist: '19,596 km from Pluto', year: '6.4 days', moons: 'Orbiting Pluto', temp: '-220 °C', target: null }
      ];

      let current = 'mars';
      let busy = false;
      let transitionActive = false;
      let expansion = 0;
      let maskScale = 0;
      let canvasOpacity = 1;
      let rotX = 0;
      let rotY = 0;
      let targetX = 0;
      let targetY = 0;
      let hasFrozenScene = false;
      let dpr = 1;

      /* DOM ELEMENTS */
      const experience = document.querySelector('.experience');
      const planetTitle = document.getElementById('planet-title');
      const nextNumber = document.getElementById('next-number');
      const nextName = document.getElementById('next-name');
      const factsList = document.getElementById('facts');
      const planetList = document.querySelector('.planet-list');
      const portalBtn = document.getElementById('portal');
      const portalVideo = document.getElementById('portal-video');
      const portalImage = document.getElementById('portal-image');
      const transitionVideo = document.getElementById('transition-video');
      const portalCanvas = document.getElementById('portal-canvas');
      const sceneCanvas = document.getElementById('scene-canvas');
      const portalCtx = portalCanvas.getContext('2d');
      const sceneCtx = sceneCanvas.getContext('2d');
      const customCursor = document.querySelector('.custom-cursor');
      const backgroundVideos = document.querySelectorAll('video.background');

      // Solar Modal Elements
      const solarModal = document.getElementById('solar-modal');
      const menuBtn = document.getElementById('menu-btn');
      const modalCloseBtn = document.getElementById('modal-close-btn');
      const solarGrid = document.getElementById('solar-grid');
      const filterBtns = document.querySelectorAll('.filter-btn');
      const celestialCanvasBg = document.getElementById('celestial-canvas-bg');
      const celestialBgCtx = celestialCanvasBg ? celestialCanvasBg.getContext('2d') : null;

      let sidebarMode = 'planets'; // 'planets' or 'moons'

      /* ====================================================================
         PROCEDURAL CELESTIAL CANVAS TEXTURES
         ==================================================================== */
      const celestialTextures = {};

      function getCelestialTexture(type) {
        if (celestialTextures[type]) return celestialTextures[type];
        const cvs = document.createElement('canvas');
        cvs.width = 1280;
        cvs.height = 720;
        const ctx = cvs.getContext('2d');

        // Starfield background
        ctx.fillStyle = '#05070c';
        ctx.fillRect(0, 0, 1280, 720);

        // Cosmic nebula dust
        const nebGrad = ctx.createRadialGradient(700, 360, 50, 700, 360, 600);
        const nebulaColors = {
          jupiter: 'rgba(217, 119, 6, 0.16)',
          saturn: 'rgba(245, 158, 11, 0.15)',
          uranus: 'rgba(6, 182, 212, 0.18)',
          neptune: 'rgba(37, 99, 235, 0.22)',
          moon: 'rgba(148, 163, 184, 0.12)',
          phobos: 'rgba(168, 85, 247, 0.12)',
          europa: 'rgba(56, 189, 248, 0.18)',
          ganymede: 'rgba(203, 213, 225, 0.14)',
          io: 'rgba(234, 179, 8, 0.22)',
          titan: 'rgba(249, 115, 22, 0.22)',
          enceladus: 'rgba(14, 165, 233, 0.2)',
          triton: 'rgba(99, 102, 241, 0.18)'
        };
        nebGrad.addColorStop(0, nebulaColors[type] || 'rgba(59, 130, 246, 0.15)');
        nebGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = nebGrad;
        ctx.fillRect(0, 0, 1280, 720);

        // Stars
        for (let i = 0; i < 90; i++) {
          const sx = (Math.sin(i * 997) * 0.5 + 0.5) * 1280;
          const sy = (Math.cos(i * 613) * 0.5 + 0.5) * 720;
          const sr = (i % 3 === 0) ? 1.5 : 0.8;
          ctx.fillStyle = `rgba(255, 255, 255, ${(i % 5 + 3) / 10})`;
          ctx.beginPath();
          ctx.arc(sx, sy, sr, 0, Math.PI * 2);
          ctx.fill();
        }

        // Planetary sphere center and geometry
        const cx = 660;
        const cy = 360;
        const r = 210;

        // Draw rings behind planet for Saturn / Uranus
        if (type === 'saturn') {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(-0.35);
          ctx.scale(1, 0.32);
          ctx.beginPath();
          ctx.arc(0, 0, 420, Math.PI, Math.PI * 2);
          ctx.lineWidth = 140;
          ctx.strokeStyle = 'rgba(224, 189, 132, 0.7)';
          ctx.stroke();
          ctx.restore();
        }

        // Sphere radial gradient (lighting from top-left)
        const pGrad = ctx.createRadialGradient(cx - r * 0.4, cy - r * 0.4, r * 0.1, cx, cy, r);

        if (type === 'jupiter') {
          pGrad.addColorStop(0, '#fde68a');
          pGrad.addColorStop(0.3, '#d97706');
          pGrad.addColorStop(0.7, '#78350f');
          pGrad.addColorStop(1, '#1c1917');
        } else if (type === 'saturn') {
          pGrad.addColorStop(0, '#fef3c7');
          pGrad.addColorStop(0.4, '#d4af37');
          pGrad.addColorStop(0.8, '#854d0e');
          pGrad.addColorStop(1, '#1c1917');
        } else if (type === 'uranus') {
          pGrad.addColorStop(0, '#cffafe');
          pGrad.addColorStop(0.4, '#22d3ee');
          pGrad.addColorStop(0.8, '#0891b2');
          pGrad.addColorStop(1, '#083344');
        } else if (type === 'neptune') {
          pGrad.addColorStop(0, '#93c5fd');
          pGrad.addColorStop(0.35, '#2563eb');
          pGrad.addColorStop(0.75, '#1e3a8a');
          pGrad.addColorStop(1, '#020617');
        } else if (type === 'moon') {
          pGrad.addColorStop(0, '#f1f5f9');
          pGrad.addColorStop(0.4, '#94a3b8');
          pGrad.addColorStop(0.8, '#334155');
          pGrad.addColorStop(1, '#020617');
        } else if (type === 'phobos') {
          pGrad.addColorStop(0, '#d6d3d1');
          pGrad.addColorStop(0.4, '#78716c');
          pGrad.addColorStop(0.8, '#44403c');
          pGrad.addColorStop(1, '#1c1917');
        } else if (type === 'europa') {
          pGrad.addColorStop(0, '#ffffff');
          pGrad.addColorStop(0.3, '#e0f2fe');
          pGrad.addColorStop(0.7, '#7dd3fc');
          pGrad.addColorStop(1, '#0c4a6e');
        } else if (type === 'ganymede') {
          pGrad.addColorStop(0, '#e2e8f0');
          pGrad.addColorStop(0.4, '#64748b');
          pGrad.addColorStop(0.8, '#334155');
          pGrad.addColorStop(1, '#090d16');
        } else if (type === 'io') {
          pGrad.addColorStop(0, '#fef08a');
          pGrad.addColorStop(0.35, '#eab308');
          pGrad.addColorStop(0.75, '#ea580c');
          pGrad.addColorStop(1, '#431407');
        } else if (type === 'titan') {
          pGrad.addColorStop(0, '#fed7aa');
          pGrad.addColorStop(0.4, '#f97316');
          pGrad.addColorStop(0.8, '#c2410c');
          pGrad.addColorStop(1, '#431407');
        } else if (type === 'enceladus') {
          pGrad.addColorStop(0, '#ffffff');
          pGrad.addColorStop(0.35, '#f0f9ff');
          pGrad.addColorStop(0.75, '#38bdf8');
          pGrad.addColorStop(1, '#082f49');
        } else if (type === 'triton') {
          pGrad.addColorStop(0, '#fce7f3');
          pGrad.addColorStop(0.4, '#f472b6');
          pGrad.addColorStop(0.8, '#4338ca');
          pGrad.addColorStop(1, '#0f172a');
        } else {
          pGrad.addColorStop(0, '#cbd5e1');
          pGrad.addColorStop(0.5, '#64748b');
          pGrad.addColorStop(1, '#0f172a');
        }

        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = pGrad;
        ctx.fill();
        ctx.clip();

        // Atmospheric bands / Surface features
        if (type === 'jupiter') {
          for (let y = -r; y <= r; y += 18) {
            ctx.fillStyle = (y % 36 === 0) ? 'rgba(120, 53, 15, 0.45)' : 'rgba(254, 243, 199, 0.35)';
            ctx.fillRect(cx - r, cy + y + Math.sin(y * 0.1) * 6, r * 2, 10);
          }
          // Great Red Spot
          ctx.beginPath();
          ctx.ellipse(cx + 60, cy + 45, 34, 22, 0.1, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(185, 28, 28, 0.85)';
          ctx.fill();
        } else if (type === 'europa') {
          // Crisscrossing fracture lineae
          ctx.strokeStyle = 'rgba(153, 27, 27, 0.55)';
          ctx.lineWidth = 2.5;
          for (let i = 0; i < 9; i++) {
            ctx.beginPath();
            ctx.moveTo(cx - r + i * 40, cy - r);
            ctx.bezierCurveTo(cx - 30 + i * 20, cy + 10, cx + 50, cy - 20, cx + r - i * 30, cy + r);
            ctx.stroke();
          }
        } else if (type === 'moon') {
          // Lunar Maria patches
          ctx.fillStyle = 'rgba(30, 41, 59, 0.45)';
          ctx.beginPath();
          ctx.ellipse(cx - 50, cy - 40, 55, 40, 0.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(cx + 40, cy + 20, 45, 35, -0.3, 0, Math.PI * 2);
          ctx.fill();
        } else if (type === 'enceladus') {
          // Southern polar cryovolcanic geyser fissures
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.7)';
          ctx.lineWidth = 3;
          for (let i = 0; i < 4; i++) {
            ctx.beginPath();
            ctx.moveTo(cx - 50 + i * 35, cy + r - 25);
            ctx.lineTo(cx - 20 + i * 35, cy + r - 5);
            ctx.stroke();
          }
        }
        ctx.restore();

        // Rings in front of planet for Saturn
        if (type === 'saturn') {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(-0.35);
          ctx.scale(1, 0.32);
          ctx.beginPath();
          ctx.arc(0, 0, 420, 0, Math.PI);
          ctx.lineWidth = 140;
          ctx.strokeStyle = 'rgba(224, 189, 132, 0.85)';
          ctx.stroke();
          ctx.restore();
        }

        // Atmospheric limb glow
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, r + 4, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.lineWidth = 6;
        ctx.stroke();
        ctx.restore();

        celestialTextures[type] = cvs;
        return cvs;
      }

      /* ====================================================================
         EASING & ANIMATION HELPER
         ==================================================================== */
      const easeInOutCubic = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

      function animateValue(setter, duration) {
        return new Promise(resolve => {
          const start = performance.now();
          function tick(now) {
            const elapsed = now - start;
            const progress = Math.min(1, elapsed / duration);
            const eased = easeInOutCubic(progress);
            setter(eased);
            if (progress < 1) {
              requestAnimationFrame(tick);
            } else {
              resolve();
            }
          }
          requestAnimationFrame(tick);
        });
      }

      /* ====================================================================
         RENDER
         ==================================================================== */
      let renderCount = 0;
      function render() {
        const state = states[current] || states.mars;
        experience.dataset.planet = current;
        planetTitle.textContent = state.name.toUpperCase();
        nextNumber.textContent = state.number;
        nextName.textContent = state.next;
        portalBtn.setAttribute('aria-label', `Travel to ${state.next}`);

        // Build facts
        factsList.innerHTML = state.facts
          .map(([k, v]) => `<div class="fact"><dt>${k}</dt><dd>${v}</dd></div>`)
          .join('');

        // Determine if current body is a planet or moon to sync sidebar view
        const isCurrentMoon = moonsList.some(m => m.toLowerCase().replace(/[^a-z]/g, '') === current.toLowerCase().replace(/[^a-z]/g, ''));
        if (renderCount === 0 && isCurrentMoon) {
          sidebarMode = 'moons';
        }

        // Render sidebar with category toggle tabs & item list
        const activeList = sidebarMode === 'planets' ? planets : moonsList;
        const tabsHtml = `
          <div class="planet-tabs" role="tablist">
            <button type="button" class="planet-tab-btn ${sidebarMode === 'planets' ? 'active' : ''}" data-mode="planets">Planets (8)</button>
            <button type="button" class="planet-tab-btn ${sidebarMode === 'moons' ? 'active' : ''}" data-mode="moons">Moons (8)</button>
          </div>
        `;
        const itemsHtml = activeList
          .map(item => {
            const itemKey = item.toLowerCase().replace('the ', '').replace(' ', '');
            const isCurrentActive = itemKey === current || item.toLowerCase() === state.name.toLowerCase();
            return `<span class="planet-item ${isCurrentActive ? 'active' : ''}" data-key="${itemKey}">${item}</span>`;
          })
          .join('');

        planetList.innerHTML = tabsHtml + itemsHtml;

        // Wire tabs click
        planetList.querySelectorAll('.planet-tab-btn').forEach(btn => {
          btn.addEventListener('click', e => {
            e.stopPropagation();
            sidebarMode = btn.dataset.mode;
            render();
          });
        });

        // Retrigger .is-switching on every re-render after first
        if (renderCount > 0) {
          planetList.classList.remove('is-switching');
          void planetList.offsetWidth;
          planetList.classList.add('is-switching');
        }
        renderCount++;

        // Background handling (Video vs Procedural Celestial Canvas)
        let hasVisibleVideo = false;
        backgroundVideos.forEach(v => {
          if (v.id === state.background) {
            v.classList.add('is-visible');
            hasVisibleVideo = true;
          } else {
            v.classList.remove('is-visible');
          }
        });

        if (celestialCanvasBg && celestialBgCtx) {
          if (!hasVisibleVideo) {
            celestialCanvasBg.width = window.innerWidth;
            celestialCanvasBg.height = window.innerHeight;
            const tex = getCelestialTexture(state.type || current);
            drawCover(celestialBgCtx, tex);
            celestialCanvasBg.classList.add('is-visible');
          } else {
            celestialCanvasBg.classList.remove('is-visible');
          }
        }

        // Toggle portal media (video, image, or canvas source)
        if (state.image) {
          portalImage.style.display = 'block';
          portalVideo.style.display = 'none';
        } else if (state.portal) {
          portalImage.style.display = 'none';
          portalVideo.style.display = 'block';
          if (portalVideo.getAttribute('src') !== state.portal) {
            portalVideo.src = state.portal;
            portalVideo.load();
          }
        } else {
          portalImage.style.display = 'none';
          portalVideo.style.display = 'none';
        }

        // Update footer telemetry
        const coordsElem = document.getElementById('footer-coordinates');
        if (coordsElem) {
          coordsElem.textContent = state.telemetry || 'SOLAR SYSTEM SURVEY';
        }
      }

      /* ====================================================================
         7. THE PORTAL — CANVAS MASK WITH FAKE 3D
         ==================================================================== */
      function resizeCanvas() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        portalCanvas.width = window.innerWidth * dpr;
        portalCanvas.height = window.innerHeight * dpr;
        portalCanvas.style.width = window.innerWidth + 'px';
        portalCanvas.style.height = window.innerHeight + 'px';
        portalCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

        if (!hasFrozenScene) {
          sceneCanvas.width = window.innerWidth * dpr;
          sceneCanvas.height = window.innerHeight * dpr;
          sceneCanvas.style.width = window.innerWidth + 'px';
          sceneCanvas.style.height = window.innerHeight + 'px';
          sceneCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
      }

      window.addEventListener('resize', resizeCanvas);

      function drawCover(targetCtx, media) {
        if (!media) return;
        const mw = media.videoWidth || media.naturalWidth || media.width || window.innerWidth;
        const mh = media.videoHeight || media.naturalHeight || media.height || window.innerHeight;
        if (!mw || !mh) return;
        const scale = Math.max(window.innerWidth / mw, window.innerHeight / mh);
        const w = mw * scale;
        const h = mh * scale;
        const x = (window.innerWidth - w) / 2;
        const y = (window.innerHeight - h) / 2;
        targetCtx.drawImage(media, x, y, w, h);
      }

      function drawShade(targetCtx) {
        const topY = window.innerHeight * 0.52;
        const grad = targetCtx.createLinearGradient(0, topY, 0, window.innerHeight);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, 'rgba(0,0,0,0.88)');
        targetCtx.fillStyle = grad;
        targetCtx.fillRect(0, topY, window.innerWidth, window.innerHeight - topY);
      }

      // Rounded-rect point sampling: 4 corners walk arc in 10 steps (~44 points)
      function getRoundedRectPoints(w, h, r) {
        const clampedR = Math.max(0, Math.min(r, w / 2, h / 2));
        const points = [];
        const corners = [
          [ w / 2 - clampedR, -h / 2 + clampedR, -Math.PI / 2, 0 ],
          [ w / 2 - clampedR,  h / 2 - clampedR, 0, Math.PI / 2 ],
          [-w / 2 + clampedR,  h / 2 - clampedR, Math.PI / 2, Math.PI ],
          [-w / 2 + clampedR, -h / 2 + clampedR, Math.PI, Math.PI * 1.5 ]
        ];

        for (let c = 0; c < 4; c++) {
          const [cx, cy, aStart, aEnd] = corners[c];
          const steps = 10;
          for (let s = 0; s <= steps; s++) {
            if (c > 0 && s === 0) continue;
            const angle = aStart + ((aEnd - aStart) * s) / steps;
            points.push({
              x: cx + Math.cos(angle) * clampedR,
              y: cy + Math.sin(angle) * clampedR
            });
          }
        }
        return points;
      }

      // Pointer tilt tracking
      window.addEventListener('pointermove', e => {
        if (busy) return;
        targetY = (e.clientX / window.innerWidth - 0.5) * 37.4;
        targetX = (e.clientY / window.innerHeight - 0.5) * -33;
      });
      window.addEventListener('pointerleave', () => {
        targetX = 0;
        targetY = 0;
      });

      let lastTime = performance.now();
      function draw(now) {
        const dt = Math.min(40, now - lastTime);
        lastTime = now;

        if (!busy) {
          rotX += (targetX - rotX) * Math.min(1, dt * 0.009);
          rotY += (targetY - rotY) * Math.min(1, dt * 0.009);
        }

        portalCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

        if (hasFrozenScene) {
          portalCtx.drawImage(sceneCanvas, 0, 0, window.innerWidth, window.innerHeight);
          drawShade(portalCtx);
        }

        const rect = portalBtn.getBoundingClientRect();
        const e = expansion;
        const rectCx = rect.left + rect.width / 2;
        const rectCy = rect.top + rect.height / 2;

        const cx = rectCx + (window.innerWidth / 2 - rectCx) * e;
        const cy = rectCy + (window.innerHeight / 2 - rectCy) * e;
        const baseW = rect.width + (window.innerWidth - rect.width) * e;
        const baseH = rect.height + (window.innerHeight - rect.height) * e;

        const scale = e ? 1 : maskScale;
        const w = baseW * scale;
        const h = baseH * scale;
        const r = 90 * (1 - e) * scale;
        const rx = rotX * (1 - e);
        const ry = rotY * (1 - e);

        if (w > 1 && h > 1) {
          const rawPoints = getRoundedRectPoints(w, h, r);
          const ax = (rx * Math.PI) / 180;
          const ay = (ry * Math.PI) / 180;
          const cosAx = Math.cos(ax);
          const sinAx = Math.sin(ax);
          const cosAy = Math.cos(ay);
          const sinAy = Math.sin(ay);

          portalCtx.save();
          portalCtx.globalAlpha = canvasOpacity;
          portalCtx.beginPath();

          for (let i = 0; i < rawPoints.length; i++) {
            const pt = rawPoints[i];
            const xx = pt.x * cosAy;
            const yy = pt.y * cosAx;
            const z = pt.x * sinAy - pt.y * sinAx;
            const p = 850 / (850 + z);
            const sx = cx + xx * p;
            const sy = cy + yy * p;
            if (i === 0) {
              portalCtx.moveTo(sx, sy);
            } else {
              portalCtx.lineTo(sx, sy);
            }
          }
          portalCtx.closePath();
          portalCtx.clip();

          portalCtx.fillStyle = '#030303';
          portalCtx.fillRect(0, 0, window.innerWidth, window.innerHeight);

          let media = transitionActive ? transitionVideo : null;
          if (!media) {
            const nextKey = states[current].nextKey || 'earth';
            const nextState = states[nextKey] || states[current];
            if (nextState.image) {
              media = portalImage;
            } else if (nextState.portal && portalVideo.readyState >= 2) {
              media = portalVideo;
            } else {
              media = getCelestialTexture(nextState.type || nextKey);
            }
          }

          drawCover(portalCtx, media);

          if (transitionActive) {
            drawShade(portalCtx);
          }

          portalCtx.restore();
        }

        requestAnimationFrame(draw);
      }

      /* ====================================================================
         8. TRAVEL TRANSITION
         ==================================================================== */
      async function travel(targetKey) {
        if (busy) return;
        const next = targetKey || states[current].nextKey || (current === 'mars' ? 'earth' : 'venus');
        if (next === current) return;
        busy = true;
        targetX = 0;
        targetY = 0;

        const transitionSrc = states[current].portal || states[next].portal || TO_EARTH;
        transitionVideo.src = transitionSrc;
        transitionVideo.load();
        experience.classList.add('is-loading');

        try {
          await new Promise(resolve => {
            let settled = false;
            const done = () => {
              if (!settled) {
                settled = true;
                resolve();
              }
            };
            transitionVideo.addEventListener('canplaythrough', done, { once: true });
            transitionVideo.addEventListener('error', done, { once: true });
            setTimeout(done, 1200);
          });

          experience.classList.remove('is-loading', 'content-revealing', 'mask-revealing');
          experience.classList.add('is-transitioning');

          transitionVideo.currentTime = 0;
          transitionVideo.playbackRate = 1.3;
          canvasOpacity = 1;
          transitionActive = true;

          try {
            await transitionVideo.play();
          } catch (e) {
            // Autoplay safety catch
          }

          await animateValue(v => {
            expansion = v;
          }, 1100);

          await new Promise(resolve => {
            let settled = false;
            const done = () => {
              if (!settled) {
                settled = true;
                resolve();
              }
            };
            transitionVideo.addEventListener('ended', done, { once: true });
            const safetyTimeout = (transitionVideo.duration ? (transitionVideo.duration / 1.3) * 1000 : 3500) + 500;
            setTimeout(done, Math.max(1200, safetyTimeout));
          });

          // Freeze final frame into sceneCanvas
          sceneCanvas.width = window.innerWidth * dpr;
          sceneCanvas.height = window.innerHeight * dpr;
          sceneCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
          sceneCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
          drawCover(sceneCtx, transitionVideo);
          hasFrozenScene = true;

          current = next;
          experience.classList.add('is-committing');
          render();

          await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

          transitionActive = false;
          expansion = 0;
          maskScale = 0;
          canvasOpacity = 1;

          experience.classList.remove('is-transitioning', 'is-committing');

          const maskReveal = revealMask();
          setTimeout(() => {
            revealPlanetContent();
          }, 100);
          await maskReveal;

          setTimeout(() => {
            transitionVideo.removeAttribute('src');
            transitionVideo.load();
            hasFrozenScene = false;
            busy = false;
          }, 450);
        } catch (err) {
          transitionActive = false;
          expansion = 0;
          maskScale = 1;
          canvasOpacity = 1;
          experience.classList.remove('is-transitioning', 'is-loading', 'is-committing');
          busy = false;
        }
      }

      function revealMask() {
        experience.classList.remove('mask-revealing');
        void experience.offsetWidth;
        experience.classList.add('mask-revealing');
        maskScale = 0;
        return animateValue(v => {
          maskScale = v;
        }, 1050);
      }

      function revealPlanetContent() {
        experience.classList.remove('content-revealing');
        void experience.offsetWidth;
        experience.classList.add('content-revealing');
      }

      portalBtn.addEventListener('click', () => travel());

      /* ====================================================================
         9. CUSTOM CURSOR
         ==================================================================== */
      let pointerX = window.innerWidth / 2;
      let pointerY = window.innerHeight / 2;
      let orbitX = pointerX;
      let orbitY = pointerY;
      let cursorVisible = false;

      window.addEventListener('pointermove', e => {
        pointerX = e.clientX;
        pointerY = e.clientY;
        if (!cursorVisible) {
          cursorVisible = true;
          customCursor.classList.add('is-visible');
        }
      });

      document.addEventListener('mouseleave', () => {
        cursorVisible = false;
        customCursor.classList.remove('is-visible');
      });

      portalBtn.addEventListener('pointerenter', () => {
        customCursor.classList.add('is-enter');
      });
      portalBtn.addEventListener('pointerleave', () => {
        customCursor.classList.remove('is-enter');
      });

      function cursorLoop() {
        orbitX += (pointerX - orbitX) * 0.2;
        orbitY += (pointerY - orbitY) * 0.2;
        customCursor.style.transform = `translate3d(${orbitX}px, ${orbitY}px, 0)`;
        requestAnimationFrame(cursorLoop);
      }

      /* ====================================================================
         6. PRELOADER
         ==================================================================== */
      function runPreloader() {
        const preloaderVideo = document.getElementById('preloader-video');
        const preloaderCount = document.getElementById('preloader-count');
        const preloaderValue = document.getElementById('preloader-value');
        const floatingLogo = document.getElementById('floating-logo');
        const preloader = document.getElementById('preloader');
        let finished = false;

        function finish() {
          if (finished) return;
          finished = true;
          preloaderValue.textContent = '100';
          preloaderCount.classList.add('is-leaving');
          floatingLogo.classList.add('is-docked');
          preloader.classList.add('is-background');
          document.body.classList.add('preload-complete');
          startExperience();
          setTimeout(() => {
            preloaderCount.remove();
          }, 750);
          setTimeout(() => {
            floatingLogo.classList.add('is-settled');
          }, 2000);
        }

        function updateProgress() {
          if (finished) return;
          if (preloaderVideo.duration) {
            const pct = Math.min(100, Math.round((preloaderVideo.currentTime / preloaderVideo.duration) * 100));
            preloaderValue.textContent = String(pct);
          }
          if (!preloaderVideo.paused && !preloaderVideo.ended) {
            requestAnimationFrame(updateProgress);
          }
        }

        function startVideo() {
          preloaderVideo.playbackRate = Math.max(0.25, preloaderVideo.duration / 3);
          const playPromise = preloaderVideo.play();
          if (playPromise !== undefined) {
            playPromise.then(() => {
              requestAnimationFrame(updateProgress);
            }).catch(() => {
              finish();
            });
          } else {
            requestAnimationFrame(updateProgress);
          }
        }

        preloaderVideo.addEventListener('ended', finish);
        preloaderVideo.addEventListener('error', finish);
        preloader.addEventListener('click', finish);

        // Fail-safe preloader completion timer so experience always starts
        setTimeout(finish, 3200);

        if (preloaderVideo.readyState >= 1) {
          startVideo();
        } else {
          preloaderVideo.addEventListener('loadedmetadata', startVideo, { once: true });
          setTimeout(() => {
            if (!finished) {
              startVideo();
            }
          }, 1500);
        }
      }

      async function waitForPortalMedia() {
        const state = states[current] || states.mars;
        if (!state.image && !state.portal) return;
        if (state.image) {
          if (portalImage.complete && portalImage.naturalWidth) return;
          await new Promise(r => {
            portalImage.onload = r;
            portalImage.onerror = r;
            setTimeout(r, 800);
          });
        } else if (state.portal) {
          if (portalVideo.readyState >= 2) return;
          await new Promise(r => {
            portalVideo.addEventListener('canplay', r, { once: true });
            portalVideo.addEventListener('error', r, { once: true });
            setTimeout(r, 800);
          });
        }
      }

      async function startExperience() {
        await waitForPortalMedia();
        await revealMask();
        document.body.classList.add('intro-ready');
        setTimeout(() => {
          revealPlanetContent();
        }, 850);
      }

      /* ====================================================================
         SOLAR SYSTEM ARCHIVE MODAL (COMPREHENSIVE EXPLORER)
         ==================================================================== */
      function renderSolarGrid(filter = 'all') {
        const filtered = celestialBodies.filter(b => filter === 'all' || b.category === filter);
        solarGrid.innerHTML = filtered.map(b => {
          const isJumpable = b.target && b.target !== current;
          return `
            <div class="solar-card">
              <div class="solar-card-top">
                <h3 class="solar-card-name">${b.name}</h3>
                <span class="solar-card-tag">${b.tag}</span>
              </div>
              <p class="solar-card-desc">${b.desc}</p>
              <div class="solar-card-metrics">
                <div>
                  <span class="metric-label">Distance</span>
                  <span class="metric-val">${b.dist}</span>
                </div>
                <div>
                  <span class="metric-label">Orbital Period</span>
                  <span class="metric-val">${b.year}</span>
                </div>
                <div>
                  <span class="metric-label">Surface Temp</span>
                  <span class="metric-val">${b.temp}</span>
                </div>
                <div>
                  <span class="metric-label">Moons</span>
                  <span class="metric-val">${b.moons}</span>
                </div>
              </div>
              <button class="solar-jump-btn" type="button" data-jump="${b.target || b.name.toLowerCase().replace('the ', '').replace(' (luna)', '').replace(' ', '')}">
                ${(b.target || b.name.toLowerCase().replace('the ', '').replace(' (luna)', '').replace(' ', '')) === current ? '● Current Orbit' : `Initiate Portal Jump to ${b.name}`}
              </button>
            </div>
          `;
        }).join('');

        // Wire up jump buttons
        solarGrid.querySelectorAll('.solar-jump-btn').forEach(btn => {
          btn.addEventListener('click', e => {
            e.stopPropagation();
            const target = btn.dataset.jump;
            closeModal();
            if (target && states[target] && !busy) {
              travel(target);
            }
          });
        });
      }

      function openModal(category = 'all') {
        solarModal.classList.add('is-open');
        solarModal.setAttribute('aria-hidden', 'false');
        filterBtns.forEach(b => {
          b.classList.toggle('active', b.dataset.filter === category);
        });
        renderSolarGrid(category);
      }

      function closeModal() {
        solarModal.classList.remove('is-open');
        solarModal.setAttribute('aria-hidden', 'true');
      }

      menuBtn.addEventListener('click', () => openModal('all'));
      modalCloseBtn.addEventListener('click', closeModal);
      solarModal.addEventListener('click', e => {
        if (e.target === solarModal) closeModal();
      });
      window.addEventListener('keydown', e => {
        if (e.key === 'Escape' && solarModal.classList.contains('is-open')) {
          closeModal();
        }
      });

      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderSolarGrid(btn.dataset.filter);
        });
      });

      // Navigation links
      document.getElementById('nav-explore').addEventListener('click', e => {
        e.preventDefault();
        openModal('all');
      });
      document.getElementById('nav-planets').addEventListener('click', e => {
        e.preventDefault();
        openModal('terrestrial');
      });
      document.getElementById('nav-moons').addEventListener('click', e => {
        e.preventDefault();
        openModal('moons');
      });
      document.getElementById('nav-about').addEventListener('click', e => {
        e.preventDefault();
        openModal('all');
      });

      // Planet list clicking: clicking any planet or moon jumps directly to that destination
      planetList.addEventListener('click', e => {
        const item = e.target.closest('.planet-item');
        if (item) {
          const key = item.dataset.key || item.dataset.planet;
          if (key && states[key] && !busy) {
            travel(key);
          }
        }
      });

      /* ====================================================================
         12. BOOT ORDER
         ==================================================================== */
      // pause + rewind every .background video
      backgroundVideos.forEach(v => {
        if (v && typeof v.pause === 'function') {
          v.pause();
          v.currentTime = 0;
        }
      });

      resizeCanvas();
      render();
      requestAnimationFrame(draw);
      requestAnimationFrame(cursorLoop);
      runPreloader();
    </script>
  </body>
</html>
